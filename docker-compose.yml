services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoiceai
      POSTGRES_USER: invoiceai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoiceai-local}
    volumes:
      - invoiceai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceai -d invoiceai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://invoiceai:${POSTGRES_PASSWORD:-invoiceai-local}@postgres:5432/invoiceai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-only-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5500
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@invoiceai.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@123}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
    volumes:
      - invoiceai-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  invoiceai-postgres:
  invoiceai-uploads:
